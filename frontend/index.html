<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AnalysisAppStratOS - TASK-1</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 2rem; background: #f7f8fa; }
    .card { max-width: 720px; background: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    input, button { padding: .6rem; font-size: 1rem; }
    input { width: 70%; }
    button { cursor: pointer; }
    .error { color: #b00020; margin-top: .75rem; }
    table { margin-top: 1rem; border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #d8dbe2; padding: .5rem; text-align: left; }
    th { background: #eef2f7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Prosta aplikacja - TASK-1</h1>
    <form id="company-form">
      <label for="company-name">Nazwa firmy</label><br />
      <input id="company-name" name="companyName" type="text" maxlength="200" required />
      <button type="submit">Zapisz</button>
    </form>
    <div id="error" class="error" role="alert"></div>

    <table id="result-table" hidden>
      <thead>
        <tr><th>Nazwa firmy</th></tr>
      </thead>
      <tbody>
        <tr><td id="result-name"></td></tr>
      </tbody>
    </table>

    <hr />

    <h2>TASK-4: Wyszukiwanie raw_records po NIP</h2>
    <form id="nip-form">
      <label for="nip-input">NIP</label><br />
      <input id="nip-input" name="nip" type="text" maxlength="20" required />
      <button type="submit">Pobierz raw_records</button>
    </form>

    <table id="raw-table" hidden>
      <thead>
        <tr id="raw-head-row"></tr>
      </thead>
      <tbody id="raw-body"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('company-form');
    const input = document.getElementById('company-name');
    const errorBox = document.getElementById('error');
    const table = document.getElementById('result-table');
    const resultName = document.getElementById('result-name');
    const nipForm = document.getElementById('nip-form');
    const nipInput = document.getElementById('nip-input');
    const rawTable = document.getElementById('raw-table');
    const rawHeadRow = document.getElementById('raw-head-row');
    const rawBody = document.getElementById('raw-body');

    function normalizeCellValue(value) {
      if (value === null || value === undefined) {
        return '';
      }
      if (typeof value === 'object') {
        return JSON.stringify(value);
      }
      return String(value);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.textContent = '';
      table.hidden = true;

      try {
        const response = await fetch('/api/company', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: input.value })
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.message || 'Wystapil blad zapisu.');
        }

        resultName.textContent = payload.name;
        table.hidden = false;
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    nipForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.textContent = '';
      rawTable.hidden = true;
      rawHeadRow.innerHTML = '';
      rawBody.innerHTML = '';

      try {
        const response = await fetch(`/api/raw-records?nip=${encodeURIComponent(nipInput.value)}`);
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.message || 'Wystapil blad odczytu.');
        }

        const records = Array.isArray(payload.records) ? payload.records : [];
        if (records.length === 0) {
          throw new Error('Brak rekordow raw_records dla podanego NIP.');
        }

        const columns = Array.from(
          records.reduce((acc, row) => {
            Object.keys(row).forEach((key) => acc.add(key));
            return acc;
          }, new Set())
        );

        columns.forEach((column) => {
          const th = document.createElement('th');
          th.textContent = column;
          rawHeadRow.appendChild(th);
        });

        records.forEach((record) => {
          const tr = document.createElement('tr');
          columns.forEach((column) => {
            const td = document.createElement('td');
            td.textContent = normalizeCellValue(record[column]);
            tr.appendChild(td);
          });
          rawBody.appendChild(tr);
        });

        rawTable.hidden = false;
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });
  </script>
</body>
</html>
