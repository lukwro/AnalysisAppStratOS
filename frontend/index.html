<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AnalysisAppStratOS - TASK-1</title>
  <style>
    body { font-family: Segoe UI, sans-serif; margin: 2rem; background: #f7f8fa; }
    .card { max-width: 720px; background: #fff; padding: 1rem; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
    input, button { padding: .6rem; font-size: 1rem; }
    input { width: 70%; }
    button { cursor: pointer; }
    .error { color: #b00020; margin-top: .75rem; }
    .status { margin-top: .75rem; color: #1f2937; }
    table { margin-top: 1rem; border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #d8dbe2; padding: .5rem; text-align: left; }
    th { background: #eef2f7; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Prosta aplikacja - TASK-1</h1>
    <form id="company-form">
      <label for="company-name">Nazwa firmy</label><br />
      <input id="company-name" name="companyName" type="text" maxlength="200" required />
      <button type="submit">Zapisz</button>
    </form>
    <div id="error" class="error" role="alert"></div>

    <table id="result-table" hidden>
      <thead>
        <tr><th>Nazwa firmy</th></tr>
      </thead>
      <tbody>
        <tr><td id="result-name"></td></tr>
      </tbody>
    </table>

    <hr />

    <h2>TASK-4: Wyszukiwanie raw_records po NIP</h2>
    <form id="nip-form">
      <label for="nip-input">NIP</label><br />
      <input id="nip-input" name="nip" type="text" maxlength="20" required />
      <button type="submit">Pobierz raw_records</button>
      <button id="import-button" type="button">Pobierz dane finansowe</button>
    </form>
    <div id="import-status" class="status" role="status"></div>

    <table id="raw-table" hidden>
      <thead>
        <tr id="raw-head-row"></tr>
      </thead>
      <tbody id="raw-body"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('company-form');
    const input = document.getElementById('company-name');
    const errorBox = document.getElementById('error');
    const table = document.getElementById('result-table');
    const resultName = document.getElementById('result-name');
    const nipForm = document.getElementById('nip-form');
    const nipInput = document.getElementById('nip-input');
    const importButton = document.getElementById('import-button');
    const importStatus = document.getElementById('import-status');
    const rawTable = document.getElementById('raw-table');
    const rawHeadRow = document.getElementById('raw-head-row');
    const rawBody = document.getElementById('raw-body');

    function normalizeCellValue(value) {
      if (value === null || value === undefined) {
        return '';
      }
      if (typeof value === 'object') {
        return JSON.stringify(value);
      }
      return String(value);
    }

    function renderRawRecords(records, options = {}) {
      const { allowEmpty = false } = options;
      rawTable.hidden = true;
      rawHeadRow.innerHTML = '';
      rawBody.innerHTML = '';

      if (!Array.isArray(records) || records.length === 0) {
        if (allowEmpty) {
          return false;
        }
        throw new Error('Brak danych RAW dla podanego NIP.');
      }

      const columns = ['nazwa', 'typ', 'wartosc'];
      columns.forEach((column) => {
        const th = document.createElement('th');
        th.textContent = column;
        rawHeadRow.appendChild(th);
      });

      function toRawEntity(record) {
        const name =
          record.raw_label ||
          record.metric_name ||
          record.title ||
          record.record_type ||
          'raw_value';

        if (record.raw_value_number !== null && record.raw_value_number !== undefined) {
          return { name, type: 'number', value: record.raw_value_number };
        }
        if (record.raw_value_text !== null && record.raw_value_text !== undefined) {
          return { name, type: 'text', value: record.raw_value_text };
        }
        if (record.raw_value_boolean !== null && record.raw_value_boolean !== undefined) {
          return { name, type: 'boolean', value: record.raw_value_boolean };
        }
        if (record.raw_value_date) {
          return { name, type: 'date', value: record.raw_value_date };
        }
        if (record.raw_value_timestamp) {
          return { name, type: 'timestamp', value: record.raw_value_timestamp };
        }
        if (record.raw_value_json !== null && record.raw_value_json !== undefined) {
          return { name, type: 'json', value: normalizeCellValue(record.raw_value_json) };
        }
        if (record.payload_text) {
          return { name, type: 'text', value: record.payload_text };
        }
        if (record.payload_json !== null && record.payload_json !== undefined) {
          return { name, type: 'json', value: normalizeCellValue(record.payload_json) };
        }
        return { name, type: 'unknown', value: '' };
      }

      records.forEach((record) => {
        const raw = toRawEntity(record);
        const tr = document.createElement('tr');
        const nameTd = document.createElement('td');
        nameTd.textContent = normalizeCellValue(raw.name);
        tr.appendChild(nameTd);

        const typeTd = document.createElement('td');
        typeTd.textContent = normalizeCellValue(raw.type);
        tr.appendChild(typeTd);

        const valueTd = document.createElement('td');
        valueTd.textContent = normalizeCellValue(raw.value);
        tr.appendChild(valueTd);

        rawBody.appendChild(tr);
      });

      rawTable.hidden = false;
      return true;
    }

    function normalizeNip(rawValue) {
      const normalizedNip = (rawValue || '').replace(/\D/g, '');
      if (normalizedNip.length !== 10) {
        throw new Error('NIP musi miec dokladnie 10 cyfr.');
      }
      return normalizedNip;
    }

    async function loadRawRecordsByNip(normalizedNip, options = {}) {
      const response = await fetch(`/api/raw-records?nip=${encodeURIComponent(normalizedNip)}`);
      const payload = await response.json();
      if (!response.ok) {
        throw new Error(payload.message || 'Wystapil blad odczytu.');
      }
      return renderRawRecords(payload.records, options);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.textContent = '';
      table.hidden = true;

      try {
        const response = await fetch('/api/company', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: input.value })
        });

        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.message || 'Wystapil blad zapisu.');
        }

        resultName.textContent = payload.name;
        table.hidden = false;
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    nipForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorBox.textContent = '';
      importStatus.textContent = '';

      try {
        const normalizedNip = normalizeNip(nipInput.value);
        await loadRawRecordsByNip(normalizedNip);
      } catch (error) {
        errorBox.textContent = error.message;
      }
    });

    importButton.addEventListener('click', async () => {
      errorBox.textContent = '';
      importStatus.textContent = '';

      try {
        const normalizedNip = normalizeNip(nipInput.value);
        importStatus.textContent = 'Import w toku... (loading)';

        const importResponse = await fetch('/api/external/metrics/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ page: 1, page_size: 20, nip: normalizedNip })
        });
        const importPayload = await importResponse.json();
        if (!importResponse.ok) {
          throw new Error(importPayload.message || 'Blad importu danych finansowych.');
        }

        importStatus.textContent =
          `Import zakonczony (success). status=completed, batch_id=${importPayload.batch_id}, inserted=${importPayload.inserted}, skipped_duplicates=${importPayload.skipped_duplicates}, errors=${importPayload.errors}`;

        const hasRawData = await loadRawRecordsByNip(normalizedNip, { allowEmpty: true });
        if (!hasRawData) {
          errorBox.textContent = 'Import zakonczony poprawnie, ale brak danych RAW dla podanego NIP.';
        }
      } catch (error) {
        importStatus.textContent = 'Import zakonczony bledem (error).';
        errorBox.textContent = error.message;
      }
    });
  </script>
</body>
</html>
